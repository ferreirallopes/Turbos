const DAY=864e5;
function toMs(v){ if(v==null||v==='') return NaN; if(/^\d+(\.\d+)?(E[+-]?\d+)?$/i.test(v)) return Math.round((parseFloat(v)-25569)*DAY);

const TEMAS=[['Financeiro (cobrança, valores, negociação, reembolso)',/FINANC|NEGOCIA|D[ÉE]BITO|VALOR|COBRAN|REEMBOLSO|BOLETO|BOLSA|NEGATIVA|MENSALIDADE|PAGAMENTO|ESTORNO|DESCONTO/,'fin'],

const CANAIS=['Reclame Aqui','Ouvidoria (e-mail)','Procon','Fale com a Reitoria','Atendimento (ameaça de Procon/MEC, descontentamento)'];

const areaN=a=>!a?'Sem área definida':/^Coordenacao/.test(a)?'Coordenações de curso':(AREAN[a]||a);

let DB=null;
function build(rows,nome){
  let max=0; for(const r of rows){ r.dt=toMs(r.cd); delete r.cd; if(r.dt>max) max=r.dt;
    r.sla=null; if(r.lim){ const st=r.st||''; let m; if(st.startsWith('Concluído no')) r.sla='ok'; else if(st.startsWith('Concluído com')) r.sla='late'; else if((m=/Atrasado há (\d+)/.exec(st))){r.sla='ol';r.dias=+m[1];} else {r.sla='oo'; m=/Faltam (\d+)/.exec(st); r.falta=m?+m[1]:0;} } }
  rows=rows.filter(r=>!isNaN(r.dt)&&r.caso); rows.sort((a,b)=>a.dt-b.dt);
  const cases=new Map(), front=new Map(), allRA=new Map();
  for(const r of rows){ const tipo=r.tipo||'',tab=r.tab||'';
    const ou=tipo==='Ouvidoria', spam=ou&&(tab==='SPAM'||/SHEIN|Teste|Inscreva-se|faturamento/i.test(r.subj||''));
    const pr=r.ass==='JURÍDICO PROCON'||r.ass==='JURÍDICO FALE COM A REITORIA';
    const fl=!ou&&tipo!=='Jurídico'&&(FLRE.test(tab)||r.pasta==='RECLAME AQUI');
    if((ou&&!spam)||pr||fl){ let c=cases.get(r.caso);
      if(!c){ c={id:r.caso,dt:r.dt,canal:ou&&r.origin==='Reclame Aqui'?0:ou?1:r.ass==='JURÍDICO PROCON'?2:r.ass==='JURÍDICO FALE COM A REITORIA'?3:4,ra:null,motivo:null,subj:r.subj||'',sla:null,dias:0,area:null,n:0}; cases.set(r.caso,c); }
      c.n++; if(!c.num&&r.num) c.num=r.num; if(r.st) c.st=r.st; if(tab) c.ult=tab; if(!c.ra&&r.ra) c.ra=r.ra; if(!c.motivo&&r.lista) c.motivo=r.lista; if(!c.area&&r.area) c.area=r.area; if(!c.sla&&r.sla) c.sla=r.sla; if(r.dias>c.dias) c.dias=r.dias; }
    if(r.ra){ if(!IMP[r.pasta]){ if(/Aluno|Candidato|CAC|Cobrança|Financeiro/.test(tipo)){ let a=front.get(r.ra); if(!a) front.set(r.ra,a=[]); a.push(r); }
        let b=allRA.get(r.ra); if(!b) allRA.set(r.ra,b=[]); b.push(r.dt); } } }
  const C=[...cases.values()]; const byRA=new Map();
  for(const c of C){ c.tema=temaDe(c); c.mk=mkey(c.dt); c.dk=dkey(c.dt);
    if(c.ra){ byRA.set(c.ra,(byRA.get(c.ra)||0)+1); const f=front.get(c.ra)||[]; let cont=0,crm=0,atr=0,pos=0;
      for(const r of f){ const dd=(c.dt-r.dt)/DAY; if(dd>0&&dd<=30){cont++; if(r.gera==='SIM')crm++; if(r.sla==='late'||r.sla==='ol')atr++;} else if(dd<0&&dd>=-30) pos++; }
      c.cont=cont;c.crm=crm;c.atr=atr;c.pos=pos; } }

    if(!k){ k={sla:r.sla,falta:r.falta==null?99:r.falta,dias:r.dias||0,tab:(r.tab||'').replace(/^(EAD|PRESENCIAL): /,''),area:r.area,ra:r.ra}; risk.set(r.caso,k);} else { if(r.dias>k.dias)k.dias=r.dias; if(r.falta!=null&&r.falta<k.falta)k.falta=r.falta; } }

  // guarda só o necessário, sem identificar o aluno (o RA vira um número sequencial)
  const idx=new Map(), ix=ra=>{ if(!ra) return null; let v=idx.get(ra); if(v==null){v=idx.size+1; idx.set(ra,v);} return v; };
  const by={}; for(const [ra,n] of byRA) by[ix(ra)]=n;
  const C2=C.map(c=>({num:c.num||'',st:c.st||'',ult:c.ult||'',dt:c.dt,canal:c.canal,ra:ix(c.ra),sla:c.sla,dias:c.dias,area:c.area,tema:c.tema,mk:c.mk,dk:c.dk,cont:c.cont||0,crm:c.crm||0,atr:c.atr||0,pos:c.pos||0}));
  const R2=R.map(k=>({g:k.g,tm:k.tm,area:k.area,alto:k.alto,ra:ix(k.ra)}));
  const months=[...new Set(C2.map(c=>c.mk))].sort();
  DB={v:1,C:C2,R:R2,byRA:by,max,months,nome,linhas:rows.length,carregada:Date.now()};
}

/* ===== Cálculo para o mês e o dia escolhidos ===== */
const cnt=(arr,fn)=>{const o={}; for(const x of arr){const k=fn(x); o[k]=(o[k]||0)+1;} return o;};
function model(M,D){ const {C,R,max}=DB; const maxD=dkey(max), P=prevM(M);
  const parcial=mkey(max)===M; const dmax=parcial?+maxD.slice(8):31;
  const CM=C.filter(c=>c.mk===M), CPfull=C.filter(c=>c.mk===P), CP=parcial?CPfull.filter(c=>+c.dk.slice(8)<=dmax):CPfull;
  const six=[]; let k=M; for(let i=0;i<6;i++){six.unshift(k);k=prevM(k);}
  const perM={}; for(const c of C) if(six.includes(c.mk)){ (perM[c.mk]=perM[c.mk]||[]).push(c); }
  const serie=fn=>six.map(m=>(perM[m]||[]).filter(fn).length);
  const cm=cnt(CM,c=>c.canal), cp=cnt(CP,c=>c.canal), tm=cnt(CM,c=>c.tema), tp=cnt(CP,c=>c.tema);
  const stock=C.filter(c=>c.sla==='ol');
  const canais=CANAIS.map((n,i)=>({n,cur:cm[i]||0,prev:cp[i]||0,sp:serie(c=>c.canal===i),venc:stock.filter(c=>c.canal===i).length,semPrazo:i===2||i===3}));
  const temas=TEMAS.map(([n,,id])=>{ const a=CM.filter(c=>c.tema===n), ra=a.filter(c=>c.ra); return {n,id,cur:a.length,prev:tp[n]||0,sp:serie(c=>c.tema===n),venc:stock.filter(c=>c.tema===n).length,prevc:ra.length?ra.filter(c=>c.cont>0).length/ra.length*100:null,crm:ra.length?ra.filter(c=>c.crm>0).length/ra.length*100:null,ext:a.filter(c=>c.canal===0||c.canal===2).length,nra:ra.length}; }).sort((a,b)=>b.cur-a.cur);
  const semMot=tm[SEM]||0;
  // dias do mês
  const nd=parcial?dmax:new Date(Date.UTC(+M.slice(0,4),+M.slice(5),0)).getUTCDate(); const pd=cnt(CM,c=>+c.dk.slice(8)); const dias=[]; for(let d=1;d<=nd;d++) dias.push({d,v:pd[d]||0});
  // comparativo de dia
  const D0=addD(D,-1), DW=addD(D,-7); const dayC=k=>C.filter(c=>c.dk===k);
  const c1=dayC(D),c0=dayC(D0),cw=dayC(DW); const d1=cnt(c1,c=>c.canal),d0=cnt(c0,c=>c.canal),dw=cnt(cw,c=>c.canal);
  const dia={D,D0,DW,n1:c1.length,n0:c0.length,nw:cw.length,canais:CANAIS.map((n,i)=>({n,cur:d1[i]||0,prev:d0[i]||0,sem:dw[i]||0})),temas:Object.entries(cnt(c1,c=>c.tema)).sort((a,b)=>b[1]-a[1]).slice(0,4)};
  // prazo
  const cmP=CM.filter(c=>c.sla), sl=cnt(cmP,c=>c.sla); const conc=(sl.ok||0)+(sl.late||0);
  const aging=[[0,7,'Até 7 dias'],[7,15,'8 a 15 dias'],[15,30,'16 a 30 dias'],[30,60,'31 a 60 dias'],[60,1e9,'Mais de 60 dias']].map(([a,b,n])=>({n,v:stock.filter(c=>c.dias>a&&c.dias<=b).length}));
  const ar=Object.entries(cnt(stock,c=>areaN(c.area))).sort((a,b)=>b[1]-a[1]); const med=a=>{a=[...a].sort((x,y)=>x-y);const n=a.length;return n?(n%2?a[(n-1)/2]:(a[n/2-1]+a[n/2])/2):0;};
  const areas=ar.slice(0,6).map(([n,v])=>({n,v,med:med(stock.filter(c=>areaN(c.area)===n).map(c=>c.dias))}));
  // antes e depois
  const cr=CM.filter(c=>c.ra), nr=cr.length||1; const pc=f=>cr.filter(f).length/nr*100;
  const antes={n:cr.length,prev:pc(c=>c.cont>0),c3:pc(c=>c.cont>=3),crm:pc(c=>c.crm>0),atr:pc(c=>c.atr>0),semCrm:pc(c=>c.cont>0&&c.crm===0),crmOk:pc(c=>c.crm>0&&c.atr===0),nada:pc(c=>!c.cont)};
  const obs=cr.filter(c=>c.dt+30*DAY<=max); const pos=(obs.length>=10&&obs.length>=0.8*cr.length)?obs.filter(c=>c.pos>0).length/obs.length*100:null;
  const rs=[...new Set(cr.map(c=>c.ra))], rc=rs.map(r=>DB.byRA[r]); const reinc={n:rs.length,um:rc.filter(x=>x===1).length,dois:rc.filter(x=>x===2).length,tres:rc.filter(x=>x>=3).length};
  // risco
  const rg=[0,1,2,3].map(g=>R.filter(k=>k.g===g).length); const rar=Object.entries(cnt(R,k=>areaN(k.area))).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const rt=Object.entries(cnt(R,k=>k.tm)).map(([n])=>{const a=R.filter(k=>k.tm===n); return {n,g:[0,1,2,3].map(g=>a.filter(k=>k.g===g).length),t:a.length,alto:a.filter(k=>k.alto).length};}).sort((a,b)=>(a.n==='Outros assuntos')-(b.n==='Outros assuntos')||b.t-a.t);

  // capacidade
  const sem=Math.max(1,nd/7); const cap={ent:cmP.length/sem,conc:conc/sem,need:stock.length/4+cmP.length/sem,entN:cmP.length,concN:conc};
  const proc=cm[2]||0,reit=cm[3]||0;
  return {M,P,parcial,dmax,maxD,CM,CP,CPfull,canais,temas,semMot,dias,dia,sl,cmP,conc,stock,aging,areas,antes,pos,reinc,risco,cap,six,semPrazo:CM.length-cmP.length,proc,reit,abOk:C.filter(c=>c.sla==='oo').length,st30:stock.filter(c=>c.dias>30).length,stRA:stock.filter(c=>c.canal===0).length};
}

/* ===== Desenho ===== */
const f=n=>Math.round(n).toLocaleString('pt-BR'), p1=x=>x==null?'—':x.toFixed(1).replace('.',',')+'%', p0=x=>x==null?'—':Math.round(x)+'%';
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function vari(a,b){ if(!a&&!b) return '<span class="v eq">= 0</span>'; if(!a) return '<span class="v up">novo</span>'; const d=Math.round((b-a)/a*100); return d>0?`<span class="v up">▲ +${d}%</span>`:d<0?`<span class="v dn">▼ −${-d}%</span>`:'<span class="v eq">= 0%</span>'; }
const vtxt=(a,b)=>{ if(!a) return b?'sem base de comparação':'sem variação'; const d=Math.round((b-a)/a*100); return (d>0?'▲ +'+d:d<0?'▼ −'+(-d):'= 0')+'%'; };
const vcls=(a,b)=>b>a?'up':b<a?'dn':'eq';
function spark(v,labels){ const m=Math.max(...v,1); return '<span class="sp" title="'+v.map((x,i)=>labels[i]+' '+x).join(' · ')+'">'+v.map((x,i)=>`<i style="height:${Math.max(4,Math.round(x/m*100))}%"${i===v.length-1?'':' class="p"'}></i>`).join('')+'</span>'; }
function hbar(rows,mx,suf){ mx=mx||Math.max(...rows.map(r=>r[1]),1); return '<div class="hb">'+rows.map(r=>`<div class="r"><span class="lb">${esc(r[0])}</span><span class="tr"><i class="${r[2]||''}" style="width:${(r[1]/mx*100).toFixed(1)}%"></i></span><b>${(suf?r[1].toFixed(1).replace('.',','):f(r[1]))+(suf||'')}</b></div>`).join('')+'</div>'; }
const li=(a,ol)=>(ol?'<ol>':'<ul>')+a.map(x=>'<li>'+x+'</li>').join('')+(ol?'</ol>':'</ul>');
const kcard=(a,b,c,d)=>`<div class="k"><b>${a}</b><span>${b}</span><small class="${d||'eq'}">${c}</small></div>`;

function render(){ if(!DB) return; const M=$('selM').value, D=$('selD').value||addD(dkey(DB.max),-1); const m=model(M,D);
  const pl=m.parcial?`1 a ${m.dmax} de ${MES[+m.P.slice(5)-1]}`:mlabel(m.P), cl=m.parcial?`${mlabel(M)} (até dia ${m.dmax})`:mlabel(M);
  const nM=m.CM.length,nP=m.CP.length, top=m.temas[0]||{n:'—',cur:0}, sm=m.six.map(mshort);
  const h=[];
  /* --- RESUMO (é o que vira imagem) --- */
  h.push(`<div id="resumo"><header><div class="ey">FAM · Reclamações de alunos</div><h1>Reclamação em Foco</h1><p>Mês: <b>${cl}</b>, comparado a <b>${pl}</b> · Dia: <b>${dlabel(m.dia.D)}</b> (${DOW[new Date(m.dia.D+'T00:00:00Z').getUTCDay()]}), comparado a <b>${dlabel(m.dia.D0)}</b> · Base de ${dlabel(m.maxD)}/${m.maxD.slice(0,4)}</p></header>`);

/* ===== Aba Casos parados: tabela analítica, uma linha por reclamação ===== */
const FX=d=>d<=7?['Até 7 dias','hg']:d<=30?['8 a 30 dias','h2']:['Mais de 30 dias','h1'];
const stTxt=t=>{ if(!t) return '—'; t=t.replace(/[^\p{L}\p{N}() ]/gu,'').trim(); let m=/Atrasado há 0*(\d+) dia/.exec(t); if(m) return 'Atrasado há '+m[1]+(m[1]==='1'?' dia':' dias'); m=/Faltam 0*(\d+) dia/.exec(t); if(m) return 'No prazo (faltam '+m[1]+' dias)'; return t.replace(/\s*\(.*$/,''); };
let CF={status:'',setor:'',faixa:'',canal:'',busca:'',ord:'dias',dir:-1};
function casosLista(){ return DB.C.filter(c=>c.sla==='ol').map(c=>({num:c.num||'',setor:areaN(c.area),dias:c.dias,faixa:FX(c.dias),status:stTxt(c.st),ult:c.ult?c.ult.charAt(0)+c.ult.slice(1).toLowerCase():'—',canal:CCURTO[c.canal],motivo:c.tema,aberta:c.dk})); }

  ${semNum?'<div class="expl" style="border-color:#c92a2a;background:#fff5f5"><b>O número do caso não está nos dados guardados.</b> Carregue a base de novo para ver a coluna com o número de cada caso.</div>':''}

function casosFiltrados(){ const b=CF.busca.trim();

const CHAVE='reclamacao_em_foco_v1';

  const ok=x=>x&&x.v===1&&x.C&&x.C.length; if(!ok(a)) a=null; if(!ok(b)) b=null; const so=document.body.classList.contains('somente'); if(so) b=null; const d=!a?b:!b?a:(b.max>a.max||(b.max===a.max&&b.carregada>a.carregada))?b:a; if(!d) return false;
  DB=d; iniciar(); const q=new Date(DB.carregada), hoje=new Date().toDateString()===q.toDateString();
  if(so){ msg(`Dados até ${dlabel(dkey(DB.max))}/${dkey(DB.max).slice(0,4)}. Painel gerado em ${q.toLocaleDateString('pt-BR')} às ${q.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}.`); return true; }
  msg(`Usando a base ${DB.nome}, com dados até ${dlabel(dkey(DB.max))}, carregada em ${q.toLocaleDateString('pt-BR')} às ${q.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}.`+(hoje?'':' Carregue a base de hoje para atualizar.'),hoje?'ok':''); return true; }

  const blob=new Blob(['<!doctype html>\n'+d.outerHTML],{type:'text/html'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='Reclamacao_em_Foco_FAM.html'; document.body.appendChild(a); a.click(); a.remove();
  msg('Painel salvo com os dados incluídos e sem os botões. Quem abrir esse arquivo só consulta, sem precisar carregar a base.','ok'); }
async function carregar(file){ try{ $('acoes').classList.add('off'); msg('Abrindo '+file.name+'…'); await tick(); const t0=performance.now(); let rows;
    if(/\.csv$/i.test(file.name)) rows=parseCsv(await file.text()); else rows=await parseXlsx(new Uint8Array(await file.arrayBuffer()),t=>msg(t));

async function imagem(){ const M=$('selM').value, D=$('selD').value||addD(dkey(DB.max),-1), m=model(M,D);
